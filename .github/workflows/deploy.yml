name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://flowiz.app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.PROD_API_URL }}
          VITE_WS_URL: ${{ secrets.PROD_WS_URL }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          VITE_GITLAB_CLIENT_ID: ${{ secrets.GITLAB_CLIENT_ID }}

      - name: Deploy to Vercel/Netlify
        run: |
          # Add deployment commands here
          # Example for Vercel: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
          echo "Deploy step - configure based on hosting provider"

      - name: Notify deployment
        run: |
          echo "Deployment successful!"
          # Add notifications (Slack, Discord, etc.)
